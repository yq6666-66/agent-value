[workspace]
resolver = "2"
# The pure-Rust core and the SQLite store are the workspace members, so
# `cargo test --workspace` never needs WebKitGTK or other system GUI libs.
# The Tauri shell in src-tauri/ is a separate package; see README "Building".
members = ["crates/agent-value-core", "crates/agent-value-store"]
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/yq6666-66/agent-value"
publish = false
