# Minimal Tauri 2 desktop shell. Intentionally NOT a member of the root Cargo
# workspace: building it needs system GUI libraries (WebKitGTK on Linux), while
# the core crate must build and test without them. Build from this directory.
[package]
name = "agent-value-app"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
agent-value-core = { path = "../crates/agent-value-core" }
agent-value-store = { path = "../crates/agent-value-store" }
# In-process probe sender. Panel commands do not call it.
agent-value-probe-http = { path = "../crates/agent-value-probe-http" }
# One-shot run behind consent and the monthly budget. The webview is not wired.
agent-value-probe-run = { path = "../crates/agent-value-probe-run" }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
