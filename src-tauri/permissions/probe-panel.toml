[[permission]]
identifier = "allow-probe-panel"
description = "Allows the webview to read probe consent, budget, and recorded results, to store the first consent decision, to run one probe for an arm already stored or already shown, and to enable or stop the in-app schedule. probe_panel and set_probe_consent do not send HTTP. run_probe_once can send when stored consent is accepted and the monthly budget allows. set_probe_schedule requires stored consent to enable, and enabling does not send. run_probe_once and set_probe_schedule receive an arm id, an environment-variable name, and a base URL, never a key value. The schedule is one thread in this process, not an operating-system cron. The page does not run a probe when it opens."
commands.allow = ["probe_panel", "set_probe_consent", "run_probe_once", "set_probe_schedule"]
